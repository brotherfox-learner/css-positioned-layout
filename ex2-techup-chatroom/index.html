<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="chat-header">
    <h1>Techup Chatroom</h1>
  </header>

  <main class="chatroom">
    <section class="messages">
      <div class="message-column column-left">
        <article class="message message--received">
          <p>😍</p>
        </article>
        <article class="message message--received">
          <p>😘</p>
        </article>
      </div>
      <div class="message-column column-right">
        <article class="message message--sent bubble-green chat right">
          <p>สวัสดีจ้า</p>
        </article>
        <article class="message message--sent bubble-light">
          <p>Coding สนุกจังเลย</p>
          <span class="message-close">×</span>
        </article>
        <article class="message message--sent bubble-green">
          <p>😝 🤩</p>
        </article>
      </div>
    </section>
    <!--
Source - https://stackoverflow.com/a
Posted by Paulie_D
Retrieved 2025-12-01, License - CC BY-SA 3.0
-->

<div class="chat left"></div>
  </main>
</body>

</html>
