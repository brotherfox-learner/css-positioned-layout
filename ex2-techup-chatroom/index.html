<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <!-- Start coding here -->
  <div class="chatroom">
    <header class="chatroom__header">Techup Chatroom</header>
    <div class="chatroom__messages">
      <div class="chatroom__column chatroom__column--left">
        <div class="bubble bubble--left">
          <span class="bubble__emoji">😍</span>
        </div>
        <div class="bubble bubble--left">
          <span class="bubble__emoji">🥰</span>
        </div>
      </div>
      <div class="chatroom__column chatroom__column--right">
        <div class="bubble bubble--right bubble--primary">
          <span>สวัสดีจ้า</span>
        </div>
        <div class="bubble bubble--right bubble--muted has-close">
          <span>Coding สนุกจังเลย</span>
          <button class="bubble__close">x</button>
        </div>
        <div class="bubble bubble--right bubble--primary">
          <span>💝 😍</span>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
